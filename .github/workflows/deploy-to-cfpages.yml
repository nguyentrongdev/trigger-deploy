name: Deploy to Cloudflare Pages
run-name: ${{ github.workflow }} (${{ inputs.branch }})

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Manual trigger với input branch tự do
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to deploy (e.g., main, develop, feature/new-feature)"
        required: true
        default: "main"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      project_name: thieponline
      deployment_url: ${{ steps.cloudflare.outputs.deployment-url }}
      deployment_alias_url: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}

    steps:
      # 1. Checkout code từ branch được validate
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          repository: nguyentrongdev/thieponline
          ref: ${{ github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0 # Fetch all history for all branches

      # 2. Prepare deployment directory
      - name: 📦 Prepare deployment files
        run: |
          echo "Preparing files for deployment..."

          # Tạo thư mục dist
          mkdir -p dist

          # Copy TẤT CẢ files và folders, TRỪ những thứ không cần
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.prettierrc' \
            --exclude='README.md' \
            --exclude='dist' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='*.bak' \
            --exclude='*.tmp' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

          echo "✅ All files copied except (.github, .prettierrc, README.md)"

          echo ""
          echo "📁 Files to deploy:"
          find dist -type f | sort

          echo ""
          echo "📊 Total size:"
          du -sh dist/

          echo "📈 Total files: $(find dist -type f | wc -l)"

      # 3. Setup Node.js for minification tools
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Install minification tools
      - name: 📦 Install minification tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser
          echo "✅ Minification tools installed"

      # 5. Optimize files (HTML, CSS, JS with minification)
      - name: 🚀 Minify static files
        run: |
          echo "Minifying HTML, CSS, JS files..."

          echo "📄 Minifying HTML files..."
          find dist -name "*.html" -type f | while read file; do
            echo "  Processing: $file"
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              "$file" -o "$file"
          done

          echo "🎨 Minifying CSS files..."
          find dist -name "*.css" -type f | while read file; do
            echo "  Processing: $file"
            cleancss -o "$file" "$file"
          done

          echo "⚡ Minifying JS files..."
          find dist -name "*.js" -type f | while read file; do
            echo "  Processing: $file"
            terser "$file" \
              --compress \
              --mangle \
              --output "$file"
          done

          echo "✅ Minification complete"

          echo ""
          echo "📊 Final size after minification:"
          du -sh dist/

      # 6. Generate meta JSON payload
      - name: 🧾 Generate meta JSON payload
        env:
          ADMIN_TOKEN_API: ${{ secrets.ADMIN_TOKEN_API }}
        run: |
          echo "📖 Extracting meta information from HTML..."

          HTML_FILE="dist/index.html"

          if [ ! -f "$HTML_FILE" ]; then
            echo "⚠️ HTML file not found: $HTML_FILE"
            echo "ℹ️ Skipping meta extraction..."
            exit 0
          fi

          echo "📦 Installing cheerio..."
          npm install cheerio --silent

          echo "🔍 Parsing HTML với Node.js + Cheerio..."
          EXTRACTED_META=$(node -e "
            const fs = require('fs');
            const cheerio = require('cheerio');
            const html = fs.readFileSync('$HTML_FILE', 'utf-8');
            const \$ = cheerio.load(html);
            const metadata = {
              title: \$('title').text().trim(),
              description: \$('meta[name=\"description\"]').attr('content') || '',
              keywords: \$('meta[name=\"keywords\"]').attr('content') || '',
              author: \$('meta[name=\"author\"]').attr('content') || '',
              ogTitle: \$('meta[property=\"og:title\"]').attr('content') || '',
              ogDescription: \$('meta[property=\"og:description\"]').attr('content') || '',
              ogImage: \$('meta[property=\"og:image\"]').attr('content') || '',
              ogUrl: \$('meta[property=\"og:url\"]').attr('content') || '',
              ogType: \$('meta[property=\"og:type\"]').attr('content') || '',
              zaloOgImage: \$('meta[property=\"zalo:og:image\"]').attr('content') || '',
              imageSrc: \$('link[rel=\"image_src\"]').attr('href') || '',
              firstImgSrc: \$('img').first().attr('src') || ''
            };
            console.log(JSON.stringify(metadata, null, 2));
          ")

          if [ $? -ne 0 ]; then
            echo "❌ Failed to parse HTML file"
            echo "ℹ️ Skipping meta extraction..."
            exit 0
          fi

          echo "✅ HTML parsed successfully"
          echo ""
          echo "📋 EXTRACTED METADATA:"
          echo "========================================="
          echo "$EXTRACTED_META" | jq '.'
          echo "========================================="
          echo ""

          TITLE=$(echo "$EXTRACTED_META" | jq -r '.title // ""')
          DESCRIPTION=$(echo "$EXTRACTED_META" | jq -r '.description // ""')
          KEYWORDS=$(echo "$EXTRACTED_META" | jq -r '.keywords // ""')
          AUTHOR=$(echo "$EXTRACTED_META" | jq -r '.author // ""')
          OG_TITLE=$(echo "$EXTRACTED_META" | jq -r '.ogTitle // ""')
          OG_DESCRIPTION=$(echo "$EXTRACTED_META" | jq -r '.ogDescription // ""')
          OG_IMAGE=$(echo "$EXTRACTED_META" | jq -r '.ogImage // ""')
          OG_URL=$(echo "$EXTRACTED_META" | jq -r '.ogUrl // ""')
          OG_TYPE=$(echo "$EXTRACTED_META" | jq -r '.ogType // ""')
          ZALO_OG_IMAGE=$(echo "$EXTRACTED_META" | jq -r '.zaloOgImage // ""')
          IMAGE_SRC=$(echo "$EXTRACTED_META" | jq -r '.imageSrc // ""')
          FIRST_IMG_SRC=$(echo "$EXTRACTED_META" | jq -r '.firstImgSrc // ""')

          NAME="${TITLE:-Thiệp Online}"
          DESCRIPTION="${DESCRIPTION:-Thiệp Online - Website thiệp điện tử}"
          OG_TITLE="${OG_TITLE:-$TITLE}"
          OG_DESCRIPTION="${OG_DESCRIPTION:-$DESCRIPTION}"
          OG_TYPE="${OG_TYPE:-website}"

          if [ -z "$IMAGE_SRC" ]; then
            IMAGE_SRC="${FIRST_IMG_SRC:-$OG_IMAGE}"
          fi

          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SUBDOMAIN=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/_/-/g' | tr '[:upper:]' '[:lower:]')

          if [ "$BRANCH_NAME" == "main" ]; then
            FINAL_OG_URL="${OG_URL:-https://thieponline.org}"
          else
            FINAL_OG_URL="${OG_URL:-https://${SUBDOMAIN}.thieponline.org}"
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg name "$NAME" \
            --arg slug "$SUBDOMAIN" \
            --arg metaDescription "$DESCRIPTION" \
            --arg metaKeywords "$KEYWORDS" \
            --arg metaAuthor "$AUTHOR" \
            --arg ogTitle "$OG_TITLE" \
            --arg ogDescription "$OG_DESCRIPTION" \
            --arg ogImage "$OG_IMAGE" \
            --arg ogUrl "$FINAL_OG_URL" \
            --arg ogType "$OG_TYPE" \
            --arg zaloOgImage "$ZALO_OG_IMAGE" \
            --arg imageSrc "$IMAGE_SRC" \
            '{
              name: $name,
              slug: $slug,
              metaDescription: $metaDescription,
              metaKeywords: $metaKeywords,
              metaAuthor: $metaAuthor,
              ogTitle: $ogTitle,
              ogDescription: $ogDescription,
              ogImage: $ogImage,
              ogUrl: $ogUrl,
              ogType: $ogType,
              zaloOgImage: $zaloOgImage,
              imageSrc: $imageSrc
            }')

          echo ""
          echo "📋 FINAL META PAYLOAD:"
          echo "========================================="
          echo "$JSON_PAYLOAD" | jq '.'
          echo "========================================="
          echo ""

          echo "$JSON_PAYLOAD" > meta-payload.json
          echo "💾 Payload saved to meta-payload.json"

          rm -f extract-meta.js

          if [ -z "$ADMIN_TOKEN_API" ]; then
            echo "⚠️ ADMIN_TOKEN_API not configured, skipping API call..."
            exit 0
          fi

          echo ""
          echo "📡 Sending POST request to: https://api.thieponline.org/admin/templates"
          echo "🔑 Authorization: Bearer ***HIDDEN***"
          echo ""

          API_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            'https://api.thieponline.org/admin/templates' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $ADMIN_TOKEN_API" \
            -H 'User-Agent: GitHub-Actions' \
            --data-raw "$JSON_PAYLOAD")

          HTTP_CODE=$(echo "$API_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$API_RESPONSE" | sed '$d')

          echo "📊 API RESPONSE DEBUG:"
          echo "========================================="
          echo "Status Code: $HTTP_CODE"
          echo ""
          echo "Response Body (raw):"
          echo "$RESPONSE_BODY"
          echo ""
          echo "Response Body (formatted):"
          echo "$RESPONSE_BODY" | jq '.' 2>/dev/null || echo "$RESPONSE_BODY"
          echo "========================================="
          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Meta information sent successfully!"
          elif [ "$HTTP_CODE" == "401" ]; then
            echo "❌ API request failed: 401 Unauthorized"
          elif [ "$HTTP_CODE" == "403" ]; then
            echo "❌ API request failed: 403 Forbidden"
          elif [ "$HTTP_CODE" == "400" ]; then
            echo "❌ API request failed: 400 Bad Request"
          elif [ "$HTTP_CODE" == "500" ]; then
            echo "❌ API request failed: 500 Internal Server Error"
          else
            echo "⚠️ API request failed with status code: $HTTP_CODE"
          fi

      # 7. Create Cloudflare Pages Project (if not exists)
      - name: 📦 Create Cloudflare Pages Project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: thieponline
        run: |
          echo "Checking if project '$PROJECT_NAME' exists..."

          PROJECT_CHECK=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          if echo "$PROJECT_CHECK" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ Project '$PROJECT_NAME' already exists"
          else
            echo "📦 Creating new project '$PROJECT_NAME'..."

            CREATE_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"$PROJECT_NAME\",
                \"production_branch\": \"main\"
              }")

            if echo "$CREATE_RESPONSE" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "✅ Project '$PROJECT_NAME' created successfully"
              echo "📍 Production branch: main"
            else
              echo "⚠️ Failed to create project"
              echo "Response:"
              echo "$CREATE_RESPONSE"
              echo ""
              echo "ℹ️ Continuing anyway - deployment may still work"
            fi
          fi

      # 8. Deploy to Cloudflare Pages (theo chuẩn cloudflare/wrangler-action)
      - name: 🚀 Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          command: |
            pages deploy dist --project-name=thieponline --branch=${{ github.event.inputs.branch || github.ref_name }} --commit-dirty=true

      # 9. Print deployment outputs
      - name: 📤 Print deployment outputs
        run: |
          echo "🔗 Deployment URL: ${{ steps.cloudflare.outputs.deployment-url }}"
          echo "🌿 Branch Alias URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}"

      # 10. Setup custom domain for all branches
      - name: 🌐 Configure Custom Domain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PROJECT_NAME: thieponline
        run: |
          ROOT_DOMAIN="thieponline.org"

          echo "🌐 Using hardcoded domain: $ROOT_DOMAIN"
          echo "✅ Domain is confirmed to exist in Cloudflare"

          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SUBDOMAIN=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/_/-/g' | tr '[:upper:]' '[:lower:]')

          if [ "$BRANCH_NAME" == "main" ]; then
            CUSTOM_DOMAIN="${ROOT_DOMAIN}"
          else
            CUSTOM_DOMAIN="${SUBDOMAIN}.${ROOT_DOMAIN}"
          fi

          echo "🌐 Setting up custom domain for branch: $BRANCH_NAME"
          echo "📍 Subdomain prefix: $SUBDOMAIN"
          echo "🔗 Full domain: $CUSTOM_DOMAIN"

          DOMAINS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          if echo "$DOMAINS" | grep -q "\"$CUSTOM_DOMAIN\""; then
            echo "✅ Domain already configured"
            DOMAIN_CONFIGURED=true
          else
            echo "Adding custom domain..."
            ADD_DOMAIN_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$CUSTOM_DOMAIN\"}")

            if echo "$ADD_DOMAIN_RESPONSE" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "✅ Custom domain added successfully"
              DOMAIN_CONFIGURED=true
            else
              echo "❌ Failed to add custom domain"
              echo "Response:"
              echo "$ADD_DOMAIN_RESPONSE"
              DOMAIN_CONFIGURED=false
            fi
          fi

          if [ "$DOMAIN_CONFIGURED" = true ]; then
            echo "📝 Configuring DNS..."
          else
            echo "⏭️ Skipping DNS configuration due to domain error"
            exit 0
          fi

          if [ "$BRANCH_NAME" == "main" ]; then
            CF_PAGES_URL="${PROJECT_NAME}.pages.dev"
          else
            CF_PAGES_URL="${SUBDOMAIN}.${PROJECT_NAME}.pages.dev"
          fi

          echo "📍 Will point to: $CF_PAGES_URL"

          EXISTING_DNS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$CUSTOM_DOMAIN&type=CNAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          if echo "$EXISTING_DNS" | grep -q "\"count\":0"; then
            curl -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"CNAME\",
                \"name\": \"$CUSTOM_DOMAIN\",
                \"content\": \"$CF_PAGES_URL\",
                \"ttl\": 1,
                \"proxied\": true
              }"
            echo "✅ DNS record created"
          else
            echo "✅ DNS record already exists"
          fi

      # 11. Output summary
      - name: 📊 Deployment Summary
        if: always()
        run: |
          ROOT_DOMAIN="thieponline.org"
          PROJECT_NAME="thieponline"
          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SUBDOMAIN=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/_/-/g' | tr '[:upper:]' '[:lower:]')

          if [ "$BRANCH_NAME" == "main" ]; then
            CF_URL="https://${PROJECT_NAME}.pages.dev"
            CUSTOM_URL="https://${ROOT_DOMAIN}"
            ENV_TYPE="Production"
          else
            CF_URL="https://${SUBDOMAIN}.${PROJECT_NAME}.pages.dev"
            CUSTOM_URL="https://${SUBDOMAIN}.${ROOT_DOMAIN}"
            ENV_TYPE="Preview"
          fi

          echo "========================================="
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ DEPLOYMENT SUCCESSFUL!"
          else
            echo "⚠️ DEPLOYMENT COMPLETED WITH WARNINGS"
          fi
          echo "========================================="
          echo ""
          echo "📦 Project: $PROJECT_NAME"
          echo "🌿 Branch: $BRANCH_NAME"
          echo "🌐 Environment: $ENV_TYPE"
          echo "📅 Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "🔗 Access URLs:"
          echo "  • Cloudflare Pages: $CF_URL"
          echo "  • Custom Domain: $CUSTOM_URL"
          echo "  • Deployment URL: ${{ steps.cloudflare.outputs.deployment-url }}"
          echo "  • Alias URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}"
          echo "========================================="

  # Job: Send Telegram Notification
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📱 Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram credentials not configured, skipping notification..."
            exit 0
          fi

          ROOT_DOMAIN="thieponline.org"
          PROJECT_NAME="thieponline"
          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          SUBDOMAIN=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/_/-/g' | tr '[:upper:]' '[:lower:]')

          if [ "$BRANCH_NAME" == "main" ]; then
            CF_URL="https://${PROJECT_NAME}.pages.dev"
            CUSTOM_URL="https://${ROOT_DOMAIN}"
            ENV_TYPE="Production"
            ENV_ICON="🚀"
          else
            CF_URL="https://${SUBDOMAIN}.${PROJECT_NAME}.pages.dev"
            CUSTOM_URL="https://${SUBDOMAIN}.${ROOT_DOMAIN}"
            ENV_TYPE="Preview"
            ENV_ICON="🔍"
          fi

          COMMIT_MSG="${{ github.event.head_commit.message || 'Manual trigger' }}"
          COMMIT_SHORT=$(echo "$COMMIT_MSG" | head -n 1 | cut -c 1-100)

          DEPLOY_KEY="${PROJECT_NAME}:${BRANCH_NAME}:${{ github.sha }}"
          GITHUB_ACTOR="${{ github.actor }}"
          DEPLOY_ID="${{ needs.deploy.outputs.deployment_url }}"
          ALIAS_URL="${{ needs.deploy.outputs.deployment_alias_url }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "🔍 Checking for duplicate notifications..."
          LAST_MESSAGES=$(curl -s -X GET "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=10&offset=-1")

          if echo "$LAST_MESSAGES" | grep -q "$DEPLOY_KEY"; then
            echo "ℹ️ Deployment already notified (duplicate detected), skipping..."
            exit 0
          fi

          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          MESSAGE="🎉 <b>Deployment Successful!</b>%0A%0A"
          MESSAGE="${MESSAGE}${ENV_ICON} <b>Environment:</b> ${ENV_TYPE}%0A"
          MESSAGE="${MESSAGE}📦 <b>Project:</b> ${PROJECT_NAME}%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${BRANCH_NAME}</code>%0A"
          MESSAGE="${MESSAGE}👤 <b>By:</b> @${GITHUB_ACTOR}%0A"
          MESSAGE="${MESSAGE}📅 <b>Time:</b> ${TIMESTAMP}%0A%0A"
          MESSAGE="${MESSAGE}🔗 <b>Access URLs:</b>%0A"
          MESSAGE="${MESSAGE}• <a href=\"${CF_URL}\">Cloudflare Pages</a>: <code>${CF_URL}</code>%0A"
          MESSAGE="${MESSAGE}• <a href=\"${CUSTOM_URL}\">Custom Domain</a>: <code>${CUSTOM_URL}</code>%0A"
          if [ -n "$ALIAS_URL" ]; then
            MESSAGE="${MESSAGE}• <a href=\"${ALIAS_URL}\">Alias URL</a>: <code>${ALIAS_URL}</code>%0A"
          fi
          MESSAGE="${MESSAGE}%0A📝 <b>Commit:</b> ${COMMIT_SHORT}%0A"
          MESSAGE="${MESSAGE}🔖 <b>Deployment:</b> <code>${DEPLOY_ID}</code>%0A%0A"
          MESSAGE="${MESSAGE}🔗 <a href=\"${WORKFLOW_URL}\">View Workflow Run</a>%0A%0A"
          MESSAGE="${MESSAGE}<code>${DEPLOY_KEY}</code>"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}" \
            -d "disable_web_page_preview=false")

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Telegram notification sent successfully!"
          else
            echo "⚠️ Failed to send Telegram notification"
            echo "Response: $RESPONSE"
          fi